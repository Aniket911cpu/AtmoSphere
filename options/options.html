<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AtmoSphere AI - Settings</title>
  <style>
    :root {
      --bg-dark: #121212;
      --glass-bg: rgba(255, 255, 255, 0.08);
      /* Darker glass for options */
      --accent-yellow: #EAB308;
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --input-bg: #27272A;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
      color: var(--accent-yellow);
    }

    .section {
      background: var(--glass-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: white;
      margin-bottom: 4px;
    }

    .help-text {
      font-size: 0.85rem;
      color: #71717A;
      margin-bottom: 16px;
    }

    button {
      background-color: var(--accent-yellow);
      color: black;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-left: 12px;
      font-size: 0.9rem;
      color: var(--accent-yellow);
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>

<body>
  <h1>AtmoSphere Settings</h1>

  <div class="section">
    <label for="apiKey">OpenAI API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <div class="help-text">Required for "News Anchor" style summaries. Keys are stored locally on your device.</div>

    <label for="customCity">Custom City Name (Display Only)</label>
    <input type="text" id="customCity" placeholder="e.g. New York">
    <div class="help-text">Overrides the displayed location name. Detection is still based on GPS.</div>

    <!-- Future: Unit Toggle -->
    <!-- <label>Units</label> -->
    <!-- <select id="units"><option value="metric">Metric (°C, km/h)</option><option value="imperial">Imperial (°F, mph)</option></select> -->
  </div>

  <button id="saveBtn">Save Settings</button>
  <span id="status">Saved!</span>

  <script src="options.js"></script>
</body>

</html>
