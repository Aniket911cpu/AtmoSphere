<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AtmoSphere AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="location-group">
        <h2 id="cityName">Detecting...</h2>
        <span class="location-icon">📍</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
    </header>

    <!-- Hero -->
    <section class="hero">
      <div class="hero-temp">
        <div id="heroIcon" class="weather-icon">--</div>
        <h1 id="currentTemp">--°</h1>
      </div>
      <p id="feelsLike" class="feels-like">Feels like --°</p>
    </section>

    <!-- AI Briefing -->
    <section class="ai-card glass">
      <div class="ai-header">
        <span class="ai-badge">AI BRIEF</span>
        <span class="ai-source">AtmoSphere</span>
      </div>
      <p id="aiSummary" class="ai-text">Analyzing atmospheric data...</p>
    </section>

    <!-- Hourly Strip -->
    <section class="hourly-strip glass">
      <div class="scroll-container" id="hourlyList">
        <!-- JS injected items -->
      </div>
    </section>

    <!-- Daily Forecast -->
    <section class="daily-list glass">
      <div id="dailyList">
        <!-- JS injected items -->
      </div>
    </section>

    <!-- Grid Stats -->
    <section class="grid-stats">
      <div class="stat-card glass">
        <span class="stat-label">UV Index</span>
        <span class="stat-value" id="uvIndex">--</span>
      </div>
      <div class="stat-card glass">
        <span class="stat-label">Humidity</span>
        <span class="stat-value" id="humidity">--%</span>
      </div>
      <div class="stat-card glass">
        <span class="stat-label">Wind</span>
        <span class="stat-value" id="windSpeed">-- km/h</span>
      </div>
      <div class="stat-card glass">
        <span class="stat-label">Precip</span>
        <span class="stat-value" id="precip">--%</span>
      </div>
    </section>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
